name: Client (Tauri)

# Two flows in one file:
#   (a) CI  — on pull_request + push to main: build the desktop bundles to
#             validate they compile/bundle. No GitHub Release is created.
#   (b) Release — on push of a 'v*' tag: build release bundles and attach them
#             to a GitHub Release.
#
# UNSIGNED BY DESIGN (privacy): no signing/notarization secrets are provided to
# tauri-action — no APPLE_* (cert/identity/id/team/password), no Windows code-
# signing cert, no notarization. macOS .app/.dmg and Windows .msi/.exe ship
# unsigned (Gatekeeper quarantine / SmartScreen expected); Linux artifacts are
# unsigned. authors=["UniSSH"] and the identity-free bundle identifier
# (me.goduni.unissh) carry no personal identity. Instead of a code-signing cert,
# each release ships a SHA256SUMS checksum file, a minisign signature over it,
# and GitHub build provenance (SLSA attestations) — verifiable with
# `gh attestation verify` (see the release-integrity job below). Provenance proves
# the public CI built exactly these artifacts from this public commit, which a paid
# cert cannot.
#
# AUTO-UPDATE (desktop): checksums and provenance only help a user who checks them
# by hand, which the second and every later install never does. So desktop bundles
# also ship updater artifacts signed with a SEPARATE bare Ed25519 key — not the
# one that signs SHA256SUMS; that one authorizes nothing, this one authorizes code
# execution, and collapsing them would merge two very different blast radii. Its
# public half is compiled into the app (client/src-tauri/tauri.conf.json). An installed
# client verifies every update against it before executing anything. This is what
# makes an unsigned distributable safe to keep current — and it costs no identity:
# minisign keys have no name, email, or keyserver. SECURITY.md promises no
# back-ports, so a user who cannot update is a user running known-vulnerable code.
# Every desktop format is covered, .deb and .rpm included: the bundler stamps the
# package type into each binary it produces, so an install knows which artifact in
# latest.json is its own. Mobile sideloads are excluded — no updater is compiled
# into them.
#
# MONOREPO: the client's path dep (client/src-tauri -> ../../rust-core/crates/ffi)
# resolves inside this single checkout — only actions/checkout of this repo is
# used. No cross-repo checkout, no CORE_REPO_TOKEN / PAT of any kind.
#
# Mobile is built for SIDELOADING only — no store listing, and no identity:
#   * Android: an installable APK must carry *a* signature, but nothing says it
#     must carry an identity. The release APK is signed by a self-signed key
#     whose certificate subject is just "CN=UniSSH Release" (no name/email/org)
#     — generated offline, stored only as a repo secret. Play Protect will warn;
#     that is the expected cost of an anonymous distributable.
#   * iOS: ships as an UNSIGNED .ipa. Stock iOS refuses unsigned code, so the
#     user re-signs it with their own Apple ID (AltStore / Sideloadly) — the
#     only identity ever attached is the installer's own, never the project's.
# Both get the same SHA256SUMS + SLSA provenance treatment as desktop.

# Path-filtered on branch pushes and PRs so a website/server/docs-only commit
# does not spend ~15 minutes bundling five platforms. THE RELEASE FLOW IS NOT
# AFFECTED: GitHub does not evaluate `paths` for tag pushes, so `v*` always runs
# the full matrix (desktop + android + ios + release-integrity) no matter which
# files the tagged commit happens to touch.
# `rust-core/**` is load-bearing here, not decoration: client/src-tauri depends
# on it by path (unissh-ffi = { path = "../../rust-core/crates/ffi" }), so a
# core change must rebuild the client. Same for rust-toolchain.toml — the
# standalone client workspace has no toolchain file of its own and inherits the
# repo-root pin by rustup walking up.
# GitHub Actions does not support YAML anchors; keep the two lists in sync.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "client/**"
      - "rust-core/**"
      - "rust-toolchain.toml"
      - "scripts/bump-version.py"
      - "scripts/assert-icons-replaced.py"
      - ".github/workflows/client.yml"
  pull_request:
    paths:
      - "client/**"
      - "rust-core/**"
      - "rust-toolchain.toml"
      - "scripts/bump-version.py"
      - "scripts/assert-icons-replaced.py"
      - ".github/workflows/client.yml"
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOTE the `os` field. Steps below branch on IT, not on the runner
          # label, because the label is not a reliable predicate: `ubuntu-22.04`
          # and `ubuntu-22.04-arm` are both Linux, and an `== 'ubuntu-22.04'`
          # test silently excludes the arm one. That is not hypothetical — the
          # webkit/AppImage dependency step was written that way, so adding the
          # arm runner without this would have skipped its system deps and failed
          # deep inside the bundler instead of at the missing package.
          # The rule is "use the predicate you actually mean", not "never look at
          # the label": the three steps that DO test a label — the frontend
          # tests, the Tauri lint, and the NASM pair — mean one specific runner or
          # one specific architecture, and each says so where it is written.
          #
          # ubuntu-22.04 pinned (both architectures): webkit2gtk-4.1 availability
          # + broad AppImage glibc compatibility. Produces .deb / .rpm / .AppImage.
          - platform: ubuntu-22.04
            os: linux
            args: ""
          # Linux on ARM is not a niche for an SSH client specifically: Asahi,
          # ARM laptops and desktop Raspberry Pi are exactly where one gets used.
          # (ARM servers are covered by the multi-arch container image instead —
          # nobody runs a GUI client on a VPS.) The runner is free for public
          # repositories, same as the arm64 runners publish-images.yml uses.
          - platform: ubuntu-22.04-arm
            os: linux
            args: ""
          # .msi (WiX) + NSIS .exe
          - platform: windows-latest
            os: windows
            args: ""
          # Windows on ARM, built NATIVELY rather than cross-compiled: this
          # runner's own host triple is aarch64-pc-windows-msvc, so there is no
          # `--target` to pass and matrix.args stays empty — the bundler reads
          # the arch off the host and emits `_arm64-setup.exe` / `_arm64_en-US.msi`
          # by itself. (Cross-compiling from the x64 runner would also have to
          # cross-build vendored OpenSSL, which is the part that goes wrong.)
          # The runner is free for public repositories, same as the arm64 Linux
          # one above and the ones publish-images.yml uses.
          #
          # Worth a leg of its own even though ARM Windows emulates x64 happily:
          # emulation is a tax on exactly the two things this app does all day,
          # vault crypto and terminal I/O.
          #
          # PURELY ADDITIVE for the installed base — this cannot strand anyone.
          # tauri-action derives the updater key from the runner's own arch
          # (utils.ts getTargetInfo: process.arch 'arm64', normalized to
          # 'aarch64'), so it ADDS `windows-aarch64` to latest.json and rewrites
          # no existing key. An x64 install sitting on an ARM machine keeps
          # polling `windows-x86_64`, because the updater matches the arch the
          # binary was COMPILED for, not the one it happens to be running on.
          - platform: windows-11-arm
            os: windows
            args: ""
          # .dmg / .app. `macos-latest` has been Apple Silicon since early 2025,
          # so a default build here is arm64-ONLY and silently ships nothing an
          # Intel Mac can run. Building the universal target instead is the fix
          # that survives: the last Intel RUNNER (`macos-15-intel`) is gone in
          # Fall 2027, but cross-compiling x86_64 from an arm64 runner is not
          # affected by that — it only needs the second rustup target below.
          #
          # SAFE FOR THE INSTALLED BASE. tauri-plugin-updater 2.10.1 looks up
          # only `{os}-{arch}-{installer}` then `{os}-{arch}` (updater.rs:578-596)
          # — there is NO `darwin-universal` fallback, so publishing that key
          # alone would strand every client already installed on `darwin-aarch64`.
          # It doesn't happen here: tauri-action's upload-version-json.ts special-
          # cases `os === 'darwin' && arch === 'universal'` and writes the SAME
          # artifact under BOTH `darwin-aarch64` and `darwin-x86_64` (guarded by
          # `if (!versionContent.platforms[...])`, so a native build still wins).
          # Verified against the released `@v0`, not just `dev` — the two have
          # disagreed before (see uploadUpdaterJson below).
          - platform: macos-latest
            os: macos
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    # Tag builds create/append to a GitHub Release → need write on contents.
    # On CI runs (branch/PR) this permission is simply unused.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # A tag must agree with the manifests it will name artifacts from. Without this,
      # `git tag v0.1.1` on an un-bumped tree produces a release full of
      # UniSSH_0.1.0_* files — which is exactly what v0.1.1 shipped.
      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        # `${GITHUB_REF_NAME#v}` is bash parameter expansion, and windows-latest
        # defaults `run:` to PowerShell — which reads `${...}` as a braced VARIABLE
        # NAME, finds no variable called `GITHUB_REF_NAME#v`, and substitutes an
        # empty string. The guard then "failed" on every Windows tag build with an
        # empty version instead of checking anything. Same fix, and same reason, as
        # the npm-install step below: Git Bash ships on every runner here.
        shell: bash
        run: |
          # `python3` is not dependable under Git Bash on the Windows runner
          # (where the interpreter is `python`); resolve whichever exists.
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/bump-version.py --check "${GITHUB_REF_NAME#v}"

      # `xdg-utils` is here for the arm64 runner: the AppImage bundler copies
      # /usr/bin/xdg-open into the AppDir and aborts if it is missing. The x86-64
      # image happens to preinstall it, the arm64 image does not — so this was
      # invisible until the ARM job existed, and it failed at bundle time with
      # every artifact already compiled. Install it rather than rely on the image.
      - name: Install Linux system deps (Tauri/webkit + AppImage/rpm tooling)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            patchelf \
            rpm \
            pkg-config \
            xdg-utils

      # KEEP libwayland OUT OF THE APPIMAGE. Without this the AppImage does not
      # start at all on a current Wayland desktop: it dies before any window with
      #     Could not create default EGL display: EGL_BAD_PARAMETER. Aborting...
      #
      # Mesa is NOT bundled — libEGL/libgbm/libdrm come from the host — but
      # libwayland-* IS, and linuxdeploy puts $APPDIR/usr/lib first on
      # LD_LIBRARY_PATH. So the host's own Mesa resolves its `libwayland-client.so.0`
      # to OUR Ubuntu 22.04 copy instead of the one it was built against, and EGL
      # init fails. Confirmed both ways on a reporter's Arch/niri box: deleting these
      # four files from an extracted AppImage fixes it outright.
      #
      # THERE IS NO ENV-VAR WORKAROUND, which is why this is fixed in the bundle
      # rather than documented. `EGL_PLATFORM=x11` was tested and does NOT help —
      # the mismatch bites when Mesa loads the library, before the platform choice
      # means anything. `GDK_BACKEND=x11` (which the AppRun hook forces) steers only
      # GTK, never Mesa.
      #
      # WHAT THIS TRADES AWAY, stated plainly: the bundled libgdk-3 and
      # libwebkit2gtk carry hard DT_NEEDED entries on libwayland-client, -cursor,
      # -egl and -server, so after this the HOST must provide all four or the app
      # will not load at all. That is a real dependency we are taking on, and it is
      # acceptable only because of who needs them: the first three are required by
      # GTK3 itself, so any host that can run any GTK3 application already has
      # them, and libwayland-server arrives with Mesa's libgbm, i.e. with hardware
      # GL. A host missing these cannot run this app bundled or not.
      #
      # The hook: tauri-bundler downloads this plugin to ~/.cache/tauri and skips
      # the download when the file already exists (bundle/linux/appimage/linuxdeploy.rs),
      # so seeding our own copy is the supported-by-construction way in. We append
      # rather than vendor the 326-line script, so upstream keeps flowing and the
      # diff stays this one deletion. Both edits are ASSERTED below rather than
      # assumed: a `sed` that matches nothing exits 0, so without the assertions an
      # upstream reword would turn either edit into a silent no-op — which is the
      # exact failure mode that shipped the broken AppImage in the first place.
      - name: Seed the AppImage GTK plugin (drop bundled libwayland)
        if: matrix.os == 'linux'
        run: |
          PLUGIN=~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          mkdir -p ~/.cache/tauri
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh \
            -o "$PLUGIN"

          # Let a user override the backend. The plugin writes a bare
          # `export GDK_BACKEND=x11` into the AppRun hook, which does not just pick
          # a default — it overwrites whatever the user exported, so the usual first
          # thing anyone tries on a Wayland desktop silently does nothing. Upstream
          # tauri's own copy of this template already uses the `:-` form; the fork
          # that actually gets downloaded has not caught up. The DEFAULT is
          # unchanged (still x11, still the safe answer for GTK on Wayland) — this
          # only stops us from welding it shut. `.*` because that line carries a
          # trailing comment: anchoring on `x11$` matches nothing at all.
          sed -i 's|^export GDK_BACKEND=x11.*|export GDK_BACKEND="${GDK_BACKEND:-x11}" # default unchanged, override allowed (UniSSH)|' "$PLUGIN"

          cat >> "$PLUGIN" <<'PLUGIN_EOF'

          # --- appended by UniSSH CI: see "KEEP libwayland OUT OF THE APPIMAGE" ---
          # Runs last in the plugin, after linuxdeploy has resolved and copied the
          # GTK dependency tree, and before the appimage output plugin packs the
          # AppDir. The host's libwayland matches the host's Mesa; ours cannot.
          # The guard is not redundant with the plugin's own `[ "$APPDIR" == "" ]`
          # check far above: this is an `rm -f` with a variable in the path, and an
          # empty APPDIR would aim it at the build machine's own /usr/lib.
          if [ -n "$APPDIR" ]; then
            echo "unissh: removing bundled libwayland-* (breaks EGL on modern Wayland hosts)"
            rm -fv "$APPDIR"/usr/lib/libwayland-*.so* || true
          else
            echo "unissh: APPDIR unset — refusing to run the libwayland cleanup" >&2
            exit 1
          fi
          PLUGIN_EOF
          chmod +x "$PLUGIN"

          # Assert both edits landed. Neither `sed` nor `cat >>` fails when it
          # achieves nothing, so this is the only thing standing between an
          # upstream reword and a silently unpatched bundle.
          grep -q 'GDK_BACKEND:-x11' "$PLUGIN" \
            || { echo "::error::GDK_BACKEND patch did not apply — upstream reworded that line."; exit 1; }
          grep -q 'removing bundled libwayland' "$PLUGIN" \
            || { echo "::error::libwayland cleanup was not appended to the GTK plugin."; exit 1; }
          echo "GTK plugin seeded and both edits verified"

      # A universal bundle is two real compilations `lipo`'d together, so BOTH
      # targets must exist before the bundler runs — the runner's default only
      # covers its own arm64. Explicit here rather than relying on tauri-action
      # to infer them from `--target`, matching how the android/ios jobs do it.
      - name: Add the macOS Rust targets (universal = arm64 + Intel)
        if: matrix.os == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Toolchain channel (1.94) + components: the standalone client/src-tauri
      # workspace inherits the pin from the repo-root rust-toolchain.toml, which
      # rustup discovers by walking up parent dirs (no per-crate toolchain file).
      - name: Cache Rust (client/src-tauri standalone workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install client npm deps
        # Force a fresh, platform-correct resolve of native optional deps.
        # @tauri-apps/cli (and Vite/oxc/rolldown) ship per-platform native
        # binaries via optionalDependencies. A package-lock generated on one OS
        # makes BOTH `npm ci` AND `npm install` skip the other OSes' binaries on
        # those runners (npm optional-deps bug npm/cli#4828) -> "Cannot find
        # module @tauri-apps/cli-<plat>". Removing the lock + node_modules first
        # forces npm to resolve THIS runner's optionals from scratch.
        # `rm -rf` needs a POSIX shell: on windows-latest the default `run:` shell
        # is PowerShell, where `rm -rf` errors out (`rm`->Remove-Item has no -rf).
        # Git Bash ships on every runner here, so pin bash for this one step.
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
        working-directory: client

      # Frontend unit tests. Run once (Linux) rather than per-platform: they are
      # pure logic with no platform surface, and the node/npm setup above is
      # already paid for here. `tsc --noEmit` is covered separately by the
      # beforeBuildCommand that tauri-action runs on every leg.
      # Pinned to ONE job on purpose, and to the platform rather than the os:
      # these tests are platform-independent, so running them on all five
      # bundler legs would just buy the same result five times.
      - name: Test (frontend)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm test
        working-directory: client

      # client/src-tauri is its OWN workspace, excluded from the root one — so
      # `cargo clippy --workspace` in ci.yml never reaches it, and a warning here
      # only ever surfaced to whoever built the app by hand. It runs in this
      # workflow rather than ci.yml because the webkit/GTK dev packages it needs
      # are already installed above. Same single-job pinning as the tests: lints
      # are platform-independent, and the cfg(windows) paths are covered by the
      # Windows job actually compiling them.
      - name: Lint (Tauri crate)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
        working-directory: client/src-tauri

      # Windows vendors + statically links OpenSSL for SQLCipher (no system
      # OpenSSL there, and the shipped .exe must be self-contained — see
      # rust-core/crates/storage/Cargo.toml). Building it from source
      # (openssl-src) uses NASM to assemble its crypto; Perl ships on the runner.
      #
      # This pair of steps keys on the RUNNER LABEL rather than on `os`, which is
      # the opposite of the rule the matrix comment lays down — deliberately, and
      # for the reason that rule exists: the predicate here is genuinely the
      # architecture, not the operating system. NASM assembles x86; ARM64 cannot
      # use a line of what it produces.
      - name: Install NASM (Windows x64 OpenSSL vendored build)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ARM64 has no NASM path at all — openssl-src configures this target as
      # VC-WIN64-ARM, whose assembly belongs to armasm64. The trap is that
      # openssl-src decides asm-vs-no-asm for EVERY msvc target the same way: it
      # shells out to `where nasm` (lib.rs, is_nasm_ready). So a NASM that merely
      # happens to be on PATH — not today's image, but any future one — would
      # switch on an assembly path this target cannot build, and it would fail
      # deep inside nmake rather than anywhere near this file. Pin the answer
      # rather than inherit it: `0` is openssl-src's documented force-disable,
      # and OpenSSL falls back to its portable C crypto.
      - name: Build the vendored OpenSSL without assembly (Windows ARM)
        if: matrix.platform == 'windows-11-arm'
        shell: bash
        run: echo "OPENSSL_RUST_USE_NASM=0" >> "$GITHUB_ENV"

      - name: Build & bundle (Tauri)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NO code-signing/notarization env on purpose — see header. Unsigned builds.
          #
          # The updater key below is NOT a code-signing certificate and does not
          # undo that: it is a bare minisign (Ed25519) keypair with no name, email,
          # or keyserver presence. It signs UPDATE PAYLOADS so an already-installed
          # client can verify what it is about to execute, which is the one thing
          # checksums and provenance cannot do (both require a human to check them).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          # `bundle.createUpdaterArtifacts: true` makes the bundler REQUIRE the
          # signing key ("A public key has been found, but no private key"), and
          # GitHub does not expose secrets to pull requests from forks. Without
          # --no-sign, every outside contributor's PR would fail at bundle time.
          # Release builds (tag pushes) always have the secret, so they sign.
          # NOTE the inverted condition. GitHub's `a && b || c` returns a VALUE,
          # and an empty string is FALSY -- so the natural-reading
          # `startsWith(tag) && '' || '--no-sign'` evaluates to '--no-sign' on
          # tags too, which silently disabled updater signing on the very builds
          # that need it. Keep the non-empty value in the truthy branch.
          # `matrix.args` carries the per-platform bundle flags (macOS: universal).
          # `format()` rather than string concatenation because the truthy branch
          # must stay non-empty for the reason above — and it always is, since it
          # begins with the literal `--no-sign`.
          args: ${{ !startsWith(github.ref, 'refs/tags/v') && format('--no-sign {0}', matrix.args) || matrix.args }}
          # Release flow (tag push): cut a GitHub Release and upload bundles.
          # CI flow (branch/PR/dispatch): tagName empty → tauri-action builds
          # the bundles only and does NOT create a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseDraft: false
          # Must stay false: installed clients poll
          # /releases/latest/download/latest.json, and GitHub's "latest" pointer
          # skips prereleases. Flipping this would publish a release whose
          # latest.json no client ever sees.
          prerelease: false
          # latest.json — the manifest the updater polls. Default-true, named here
          # because it is load-bearing rather than incidental. All five desktop
          # jobs upload it for the same tag; tauri-action merges each platform's
          # entry into the existing asset instead of overwriting it. VERIFY on the
          # first real release that latest.json ends up with ALL SIX keys —
          # darwin-aarch64, darwin-x86_64, windows-x86_64, windows-aarch64,
          # linux-x86_64, linux-aarch64 — because if a job overwrote the asset
          # instead of merging into it, whichever platforms are missing from the
          # result would silently never see an update again. The two darwin keys
          # both point at the ONE universal .app.tar.gz and share its signature;
          # that is tauri-action's universal handling, not a bug.
          # The input is `uploadUpdaterJson` as of tauri-action v1, which renamed it
          # from `includeUpdaterJson`. Both names must stay on the maintainer's radar
          # because an unknown input is only a WARNING, never an error: whichever name
          # is wrong for the pinned major looks perfectly fine in the diff and in the
          # run log. The saving grace is that this input DEFAULTS TO TRUE, so the
          # rename could not have silently disabled the updater manifest — it is named
          # here because it is load-bearing, not because the default is wrong.
          uploadUpdaterJson: true
          # No releaseBody here on purpose. GitHub generates the changelog
          # (generateReleaseNotes) and the release-integrity job appends the
          # download/verify footer once, at the end. Setting a body here would
          # (a) push the changelog below a wall of boilerplate, since GitHub
          # PRE-pends the body to what it generates, and (b) have all five
          # desktop jobs race to write the same field.
          generateReleaseNotes: true

      # The tripwire for the seeding step above. That step works by a mechanism
      # tauri-bundler never promised — it skips the download when ~/.cache/tauri
      # already holds the plugin — so the day it moves that cache, the seeding
      # stops silently and the AppImage goes back to being unlaunchable on Wayland
      # with nothing in the log to say so. This turns that silence into a failed
      # job. `|| true` on the extract because a `set -e` shell would otherwise
      # abort before the check that produces the useful message.
      #
      # Runs after tauri-action rather than before, because tauri-action builds and
      # uploads in one step and there is no seam between them. On a tag that means
      # the bad artifact is already on the release when this fires — a loud failure
      # to act on, not a gate. Fixing that properly means driving `tauri build`
      # ourselves, which costs more than it buys today.
      - name: Verify no libwayland got bundled into the AppImage
        if: matrix.os == 'linux'
        run: |
          # Absolute up front: the extract has to run from inside the scratch dir
          # (--appimage-extract always writes ./squashfs-root, with no way to aim
          # it elsewhere), and a relative path would break the moment we cd.
          APPIMAGE=$(find client/src-tauri/target -name '*.AppImage' -print -quit)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::no .AppImage produced — nothing to verify"; exit 1
          fi
          APPIMAGE=$(realpath "$APPIMAGE")
          echo "checking $APPIMAGE"
          chmod +x "$APPIMAGE"
          WORK=$(mktemp -d)
          ( cd "$WORK" && "$APPIMAGE" --appimage-extract >/dev/null ) || true
          if [ ! -d "$WORK/squashfs-root" ]; then
            echo "::error::could not extract the AppImage — the check below would pass vacuously."
            exit 1
          fi
          # The pattern must mirror the cleanup's glob EXACTLY, `.so*` included.
          # A bare `libwayland-*` also matches the packages' documentation
          # directories under usr/share/doc, which are inert and which the arm64
          # runner image happens to carry while the x86-64 one does not — so the
          # looser pattern failed every ARM build and passed every other one,
          # for a difference that has nothing to do with what is being checked.
          if find "$WORK/squashfs-root" -name 'libwayland-*.so*' -print -quit | grep -q .; then
            echo "::error::libwayland-*.so is back in the AppImage — the GTK-plugin seeding stopped working."
            echo "This AppImage will fail to start on Wayland with EGL_BAD_PARAMETER."
            find "$WORK/squashfs-root" -name 'libwayland-*.so*'
            exit 1
          fi
          echo "clean: no libwayland-*.so in the bundle"

      # Desktop bundles as a downloadable artifact — the only way to hand someone a
      # build WITHOUT cutting a release. Until this existed the mobile legs uploaded
      # theirs and the five desktop legs built theirs and threw them away, so the
      # answer to "can you send me a build to test?" was "only by tagging a release",
      # which is a terrible reason to burn a version number and puts an untested
      # build in front of every existing user's updater.
      #
      # Non-tag runs only: on a tag these same files are already on the release, and
      # duplicating a few hundred MB per leg into artifact storage buys nothing.
      #
      # Paths are named per bundle type rather than globbing the bundle directory,
      # which also contains the bundler's scratch (the multi-hundred-MB *.AppDir
      # tree the AppImage is packed from). macOS is separate because
      # `--target universal-apple-darwin` puts its output under the target triple.
      # `if-no-files-found: error` on purpose: a silently empty artifact is worse
      # than a failed job, because it is only discovered by whoever downloads it.
      - name: Upload the desktop bundles (share a build without a release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 30
          path: |
            client/src-tauri/target/release/bundle/appimage/*.AppImage
            client/src-tauri/target/release/bundle/deb/*.deb
            client/src-tauri/target/release/bundle/rpm/*.rpm
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/nsis/*.exe
            client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ---------------------------------------------------------------------------
  # Android: arm64 sideload APK, signed by an identity-free self-signed key
  # (see the header). gen/android is gitignored by design, so the project is
  # (re)generated here on every run — the signing block is injected right after
  # init, before gradle ever evaluates the project.
  # ---------------------------------------------------------------------------
  # Can this run sign at all? GitHub withholds repository secrets from
  # Dependabot-authored runs (they read a separate, empty store) and from
  # fork pull requests. The keystore is materialised by base64-decoding a
  # secret, so on those runs the .p12 is an empty file and gradle dies on it —
  # but only at the packaging step, i.e. after ~26 minutes of Rust compilation,
  # with `KeytoolException: Tag number over 30 is not supported`, which reads
  # like a corrupt keystore rather than an absent one.
  #
  # This gate turns that into a skip that costs seconds. It is deliberately a
  # separate job: `secrets` is not available in a job-level `if`, so the check
  # has to happen in a step and be handed on as an output.
  #
  # NOT a candidate for giving Dependabot access to the secret instead. This one
  # signs the artifact users install; a bot-authored branch must never be able to
  # reach it.
  android-signable:
    name: android (can this run sign?)
    runs-on: ubuntu-latest
    outputs:
      signable: ${{ steps.check.outputs.signable }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "signable=true" >> "$GITHUB_OUTPUT"
          else
            echo "signable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Android keystore secret on this run (Dependabot or fork PR) — skipping the Android build. Nothing is wrong with the change; the signing key is intentionally out of reach here."
          fi

  android:
    name: build (android, all ABIs)
    runs-on: ubuntu-latest
    needs: android-signable
    if: needs.android-signable.outputs.signable == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # A tag must agree with the manifests it will name artifacts from. Without this,
      # `git tag v0.1.1` on an un-bumped tree produces a release full of
      # UniSSH_0.1.0_* files — which is exactly what v0.1.1 shipped.
      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        # `${GITHUB_REF_NAME#v}` is bash parameter expansion, and windows-latest
        # defaults `run:` to PowerShell — which reads `${...}` as a braced VARIABLE
        # NAME, finds no variable called `GITHUB_REF_NAME#v`, and substitutes an
        # empty string. The guard then "failed" on every Windows tag build with an
        # empty version instead of checking anything. Same fix, and same reason, as
        # the npm-install step below: Git Bash ships on every runner here.
        shell: bash
        run: |
          # `python3` is not dependable under Git Bash on the Windows runner
          # (where the interpreter is `python`); resolve whichever exists.
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/bump-version.py --check "${GITHUB_REF_NAME#v}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Setup Java (AGP)
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Add the Android Rust targets (one per shipped ABI)
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Cache Rust (client/src-tauri standalone workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          key: android

      - name: Point the build at the runner's preinstalled NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          # openssl-src (vendored libcrypto for SQLCipher — see
          # rust-core/crates/storage/Cargo.toml) discovers the android clang
          # wrappers via PATH, not via the *_HOME vars.
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install client npm deps
        # Same fresh-resolve rationale as the desktop job (npm/cli#4828).
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
        working-directory: client

      # `tauri android init` scaffolds the project with TAURI'S OWN default icons
      # and `tauri icon` then overwrites them. That ordering is load-bearing and
      # fails silently: a run where the second command stopped writing to the
      # generated tree — an upstream layout change, say — still succeeds and ships
      # an APK wearing someone else's logo. Nothing else in the pipeline looks at
      # icons, so hash what init scaffolded and require afterwards that every one
      # of those files changed. That asserts "our icon replaced the default"
      # without hardcoding what either icon looks like.
      - name: Generate the Android project + icons
        run: |
          npx tauri android init
          find src-tauri/gen/android -name 'ic_launcher*.png' \
            -exec sha256sum {} + > /tmp/icons-before.txt
          npx tauri icon src-tauri/app-icon.json
          find src-tauri/gen/android -name 'ic_launcher*.png' \
            -exec sha256sum {} + > /tmp/icons-after.txt
          python3 ../scripts/assert-icons-replaced.py /tmp/icons-before.txt /tmp/icons-after.txt
        working-directory: client

      - name: Wire release signing into the generated gradle project
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > gen/android/unissh-release.p12
          python3 - <<'PYEOF'
          import pathlib, sys

          p = pathlib.Path("gen/android/app/build.gradle.kts")
          s = p.read_text()
          if "signingConfigs" in s:
              sys.exit("signingConfigs already present — template changed, re-check this patch")

          sign = """
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH")!!)
                      storeType = "PKCS12"
                      keyAlias = "unissh"
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          """
          out = s.replace("android {", "android {" + sign, 1)
          if out == s:
              sys.exit("anchor `android {` not found in build.gradle.kts")
          s = out
          out = s.replace(
              'getByName("release") {',
              'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")',
              1,
          )
          if out == s:
              sys.exit('anchor `getByName("release") {` not found in build.gradle.kts')
          p.write_text(out)
          print("release signing wired into app/build.gradle.kts")
          PYEOF
        working-directory: client/src-tauri

      # rustls-platform-verifier is not pure Rust: reaching Android's trust store
      # means calling into the JVM, so the crate ships a Kotlin component next to
      # it and the Gradle project has to be pointed at it. Without this the Rust
      # side initialises against classes that are not in the APK and every HTTPS
      # request dies — which is bug #34, where the failure surfaced as reqwest's
      # "event loop thread panicked" with the real cause thrown away.
      #
      # The crate bundles a local Maven repository; `cargo metadata` is the only
      # supported way to locate it on disk (the path contains the registry hash
      # and the crate version). Resolving it HERE rather than in Gradle is what
      # keeps the injected snippet to two literals — the upstream Kotlin recipe
      # parses the JSON inside build.gradle.kts, which needs kotlinx-serialization
      # on the buildscript classpath and a version catalog entry, neither of which
      # Tauri's generated project has.
      #
      # gen/android is regenerated on every run (see the job header), so baking an
      # absolute path in is safe: nothing outlives this job.
      - name: Wire the rustls-platform-verifier Android component into gradle
        run: |
          python3 - <<'PYEOF'
          import json, pathlib, subprocess, sys

          meta = json.loads(subprocess.run(
              ["cargo", "metadata", "--format-version", "1",
               "--filter-platform", "aarch64-linux-android",
               "--manifest-path", "Cargo.toml"],
              capture_output=True, text=True, check=True).stdout)

          pkg = next((p for p in meta["packages"]
                      if p["name"] == "rustls-platform-verifier-android"), None)
          if pkg is None:
              sys.exit("rustls-platform-verifier-android is not in the dependency graph — "
                       "did the reqwest `rustls` feature or the android-only dependency change?")

          maven = pathlib.Path(pkg["manifest_path"]).parent / "maven"
          if not maven.is_dir():
              sys.exit(f"expected a bundled maven repo at {maven}, found none")
          version = pkg["version"]

          # Where repositories may be declared depends on the generated template:
          # AGP's dependencyResolutionManagement (settings.gradle.kts) takes
          # precedence and FORBIDS project-level repositories when it is present,
          # so it has to be tried first.
          # The URL expression is the ONE part that is not DSL-agnostic. In the Kotlin
          # DSL `url` is typed `URI`, so assigning a String is a compile error
          # ("inferred type is String but URI! was expected") — it needs uri(...),
          # which is in scope because the block lands inside a Project script. Groovy
          # is untyped and takes the string straight through setUrl(Object).
          def repo_block(path):
              url = (f'uri("file://{maven}")' if path.suffix == ".kts"
                     else f'"file://{maven}"')
              return f'''
                  maven {{
                      url = {url}
                      metadataSources.artifact()
                  }}'''

          # `repositories {` alone is NOT a safe anchor: settings.gradle.kts opens with
          # pluginManagement, whose repositories serve the BUILD's plugins and never the
          # app's dependencies. Each candidate therefore names the block it must land
          # inside, and the anchor is only accepted after it.
          # Tauri generates a MIXED DSL — settings.gradle is Groovy, app/build.gradle.kts
          # is Kotlin — so both spellings of each file are candidates. The block above is
          # accepted by either DSL; upstream's own Groovy and Kotlin recipes are identical
          # apart from how they compute the path, and this one bakes it in as a literal.
          candidates = [
              (pathlib.Path("gen/android/settings.gradle.kts"), "dependencyResolutionManagement"),
              (pathlib.Path("gen/android/settings.gradle"), "dependencyResolutionManagement"),
              (pathlib.Path("gen/android/build.gradle.kts"), "allprojects"),
              (pathlib.Path("gen/android/build.gradle"), "allprojects"),
              (pathlib.Path("gen/android/app/build.gradle.kts"), None),
          ]
          for path, scope in candidates:
              if not path.is_file():
                  continue
              s = path.read_text()
              if "rustls-platform-verifier" in s:
                  sys.exit(f"{path} already mentions rustls-platform-verifier — re-check this patch")
              start = 0 if scope is None else s.find(scope)
              if start < 0:
                  continue
              at = s.find("repositories {", start)
              if at < 0:
                  continue
              cut = at + len("repositories {")
              path.write_text(s[:cut] + repo_block(path) + s[cut:])
              print(f"maven repo added to {path}"
                    + (f" (inside {scope})" if scope else ""))
              break
          else:
              # Dump what is actually there: these files are small, and one failed run
              # that shows them is cheaper than another round trip guessing at the template.
              for path, _ in candidates:
                  if path.is_file():
                      print(f"----- {path} -----")
                      print(path.read_text())
              sys.exit("no dependency `repositories {` block found — the generated gradle "
                       "template changed; the files above show where it moved to")

          app = pathlib.Path("gen/android/app/build.gradle.kts")
          s = app.read_text()
          dep = f'\n    implementation("rustls:rustls-platform-verifier:{version}")'
          out = s.replace("dependencies {", "dependencies {" + dep, 1)
          if out == s:
              sys.exit("anchor `dependencies {` not found in app/build.gradle.kts")
          app.write_text(out)
          print(f"rustls:rustls-platform-verifier:{version} added to app/build.gradle.kts")
          PYEOF
        working-directory: client/src-tauri

      # TWO invocations on purpose, and the order matters.
      #
      # `--target aarch64` used to be passed here, which built exactly one ABI:
      # every x86_64 emulator (i.e. anyone evaluating the app on a desktop) and
      # every armv7 device got no artifact at all, with nothing on the release
      # page saying so. The CLI's default is "all by default" — so dropping the
      # flag is what widens it.
      #
      # Pass 1 (no --split-per-abi) produces ONE universal APK carrying all four
      # ABIs. That is the file a human sideloading onto an unknown device should
      # get: it cannot be the wrong one. Pass 2 produces the per-ABI APKs for
      # people who would rather not carry ~4x the native code.
      #
      # Pass 1's output must be moved aside BEFORE pass 2 runs: both write into
      # the same gradle output dir, and the split build would otherwise clobber
      # (or be mistaken for) the universal one when collecting. Pass 2 is cheap
      # despite the doubled gradle work — the Rust objects it needs are already
      # in the cargo target dir from pass 1.
      - name: Build the signed release APKs (universal, then per-ABI)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/client/src-tauri/gen/android/unissh-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eux
          npx tauri android build --apk
          mkdir -p "$GITHUB_WORKSPACE/apk-universal"
          find src-tauri/gen/android -name '*-release.apk' \
            -exec mv {} "$GITHUB_WORKSPACE/apk-universal/" \;
          npx tauri android build --apk --split-per-abi
        working-directory: client

      - name: Collect + verify every APK signature
        run: |
          set -eu
          VERSION=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          SIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          mkdir -p out

          # The split build lays output out as `.../apk/<abi>/release/app-<abi>-release.apk`,
          # so the ABI is read from the path rather than guessed from a substring of
          # the filename. Substring matching was the first attempt and it was wrong
          # twice over: Tauri labels the variants with ITS target names, not gradle's
          # ABI names (armv7 comes out as `arm`, not `armeabi-v7a`), and `*arm*` also
          # matches `arm64`, so order became load-bearing. Reading the directory is
          # exact and needs no ordering rules.
          #
          # `universal` maps to SKIP: depending on the gradle template the split build
          # may ALSO emit a universal APK, which duplicates what pass 1 collected —
          # not an error.
          abi_of() {
            # .../apk/<abi>/release/x.apk -> <abi>
            basename "$(dirname "$(dirname "$1")")"
          }
          name_for() {
            case "$(abi_of "$1")" in
              universal)            echo "SKIP" ;;
              arm64|arm64-v8a)      echo "UniSSH_${VERSION}_arm64.apk" ;;
              arm|armeabi-v7a)      echo "UniSSH_${VERSION}_armv7.apk" ;;
              x86_64)               echo "UniSSH_${VERSION}_x86_64.apk" ;;
              x86|i686)             echo "UniSSH_${VERSION}_x86.apk" ;;
              *)                    echo "" ;;
            esac
          }

          # An unmatched glob expands to the literal pattern, so `-e` is what
          # actually detects "pass 1 produced nothing" here.
          for APK in apk-universal/*.apk; do
            if [ ! -e "$APK" ]; then
              echo "universal APK missing — pass 1 produced no *-release.apk" >&2
              exit 1
            fi
            cp "$APK" "out/UniSSH_${VERSION}_universal.apk"
          done

          for APK in $(find client/src-tauri/gen/android -name '*-release.apk'); do
            OUT=$(name_for "$APK")
            # Plain `if`, not `[ ... ] && continue`: under `set -e` a false test
            # as the first half of an AND-list is a documented footgun.
            if [ "$OUT" = "SKIP" ]; then
              continue
            fi
            if [ -z "$OUT" ]; then
              echo "unrecognized split APK name: $APK" >&2
              exit 1
            fi
            cp "$APK" "out/$OUT"
          done

          # Five artifacts expected: universal + 4 ABIs. Fail loudly rather than
          # shipping a release that is quietly missing an architecture again.
          COUNT=$(ls out | wc -l)
          if [ "$COUNT" -ne 5 ]; then
            echo "expected 5 APKs (universal + 4 ABIs), found $COUNT:" >&2
            ls -l out >&2
            exit 1
          fi

          # An unsigned APK installs nowhere; verify each one rather than
          # assuming the injected signingConfig applied to every variant.
          for APK in out/*.apk; do
            echo "--- $APK"
            "$SIGNER" verify --print-certs "$APK"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # tauri-action (desktop job) creates the release with the full notes;
          # wait for it instead of racing it with a bare `release create` that
          # would win the race and ship an empty body.
          for i in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "${{ github.ref_name }}" out/*.apk \
            --repo "${{ github.repository }}" --clobber

  # ---------------------------------------------------------------------------
  # iOS: unsigned sideload .ipa (see the header — the installer re-signs with
  # their own Apple ID; the project never touches a signing identity). Built
  # with xcodebuild directly because `tauri ios build` insists on a signing
  # team; the Xcode build phase still drives the Rust/frontend build via the
  # tauri CLI (`tauri ios xcode-script`).
  # ---------------------------------------------------------------------------
  ios:
    name: build (ios, unsigned sideload ipa)
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # A tag must agree with the manifests it will name artifacts from. Without this,
      # `git tag v0.1.1` on an un-bumped tree produces a release full of
      # UniSSH_0.1.0_* files — which is exactly what v0.1.1 shipped.
      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        # `${GITHUB_REF_NAME#v}` is bash parameter expansion, and windows-latest
        # defaults `run:` to PowerShell — which reads `${...}` as a braced VARIABLE
        # NAME, finds no variable called `GITHUB_REF_NAME#v`, and substitutes an
        # empty string. The guard then "failed" on every Windows tag build with an
        # empty version instead of checking anything. Same fix, and same reason, as
        # the npm-install step below: Git Bash ships on every runner here.
        shell: bash
        run: |
          # `python3` is not dependable under Git Bash on the Windows runner
          # (where the interpreter is `python`); resolve whichever exists.
          PY=$(command -v python3 || command -v python)
          "$PY" scripts/bump-version.py --check "${GITHUB_REF_NAME#v}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Add the iOS Rust target
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust (client/src-tauri standalone workspace)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          key: ios

      - name: Install client npm deps
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
        working-directory: client

      # Same scaffold-then-overwrite hazard as the Android job — see the comment
      # there. iOS keeps its icons in the asset catalog rather than mipmap dirs.
      - name: Generate the iOS project + icons
        run: |
          npx tauri ios init
          find src-tauri/gen/apple -path '*AppIcon.appiconset*' -name '*.png' \
            -exec shasum -a 256 {} + > /tmp/icons-before.txt
          npx tauri icon src-tauri/app-icon.json
          find src-tauri/gen/apple -path '*AppIcon.appiconset*' -name '*.png' \
            -exec shasum -a 256 {} + > /tmp/icons-after.txt
          python3 ../scripts/assert-icons-replaced.py /tmp/icons-before.txt /tmp/icons-after.txt
        working-directory: client

      - name: Build the unsigned IPA (tauri ios build --no-sign)
        # --no-sign is the upstream unsigned path: xcodebuild archives with
        # codesigning skipped and the CLI packages the IPA from the .xcarchive
        # itself (no exportArchive, which would demand a team). Running plain
        # xcodebuild instead does NOT work: the generated project's build phase
        # calls `tauri ios xcode-script`, which dials the options server that
        # only `tauri ios build/dev` starts.
        run: npx tauri ios build --no-sign --ci
        working-directory: client

      - name: Collect the IPA
        run: |
          IPA=$(find client/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "no .ipa produced; build dir:"
            find client/src-tauri/gen/apple/build -maxdepth 3 | head -30
            exit 1
          fi
          VERSION=$(node -p "require('./client/src-tauri/tauri.conf.json').version")
          OUT="UniSSH_${VERSION}_ios-sideload.ipa"
          cp "$IPA" "$OUT"
          echo "IPA_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Attach to the release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "${{ github.ref_name }}" "$IPA_NAME" \
            --repo "${{ github.repository }}" --clobber

  # ---------------------------------------------------------------------------
  # Release integrity (tag builds only): publish a SHA256SUMS file and a build
  # provenance attestation for the artifacts tauri-action just uploaded.
  #
  # This is the compensating control for unsigned-by-design releases: no Apple/
  # Authenticode cert (which would require a legal identity), but every artifact
  # gets (a) a checksum users can verify and (b) a SLSA provenance attestation
  # bound — via GitHub OIDC, no personal key — to this repo + workflow + commit.
  # Verify a download with:  gh attestation verify <file> --repo goduni/unissh
  # ---------------------------------------------------------------------------
  release-integrity:
    name: checksums + provenance
    # Waits for mobile too so the APK/IPA land in SHA256SUMS. `!cancelled()`
    # (not the implicit success()) so a broken mobile leg degrades the release
    # to desktop-only instead of shipping desktop artifacts with no checksums.
    needs: [build, android, ios]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload SHA256SUMS to the release
      id-token: write # OIDC for build provenance
      attestations: write # write the attestation
    steps:
      - name: Download the release artifacts tauri-action uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --dir dist
          # Drop any integrity files from a previous re-run so they are neither
          # attested nor re-hashed into themselves.
          rm -f dist/SHA256SUMS dist/SHA256SUMS.minisig

      - name: Attest build provenance for the artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"

      - name: Generate SHA256SUMS (bare filenames, for `sha256sum -c`)
        run: |
          ( cd dist && sha256sum * ) > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" SHA256SUMS \
            --repo "${{ github.repository }}" --clobber

      # Pseudonymous signature over SHA256SUMS. minisign (a single Ed25519 public
      # key, NO name/email, no keyservers/WoT) is the anonymity-safe choice —
      # unlike GPG (identity in the UID) or cosign keyless (OIDC identity in the
      # public Rekor log). The public key is published in SECURITY.md and in the
      # release body, so a checksum file swapped on the release page is detectable.
      #
      # This is a SEPARATE key from the updater's (see the build job): this one
      # signs "what you downloaded by hand", the updater's signs "what may execute
      # on your machine without asking". Same algorithm, deliberately different
      # blast radius.
      #
      # The key is passwordless on purpose: the key material IS the repo secret, so
      # a passphrase stored beside it in the same secret store protects nothing and
      # only adds a way for the release to fail.
      - name: Sign SHA256SUMS with minisign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          # '%s\n': minisign requires the trailing newline on the key file.
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          minisign -S -s minisign.key -m SHA256SUMS -x SHA256SUMS.minisig
          rm -f minisign.key
          minisign -Vm SHA256SUMS -x SHA256SUMS.minisig \
            -P 'RWQvV7DIid665aUPiJiN5NXimAehmWEjgRS9uLgi2nSWIUiiBY7ZKCAs'
          gh release upload "${{ github.ref_name }}" SHA256SUMS.minisig \
            --repo "${{ github.repository }}" --clobber

      # Release notes, written once and last.
      #
      # tauri-action created the release with GitHub's generated changelog and no
      # body of its own. Everything that does NOT change between releases lives in
      # the README and is linked, not inlined: the previous version of this pasted
      # ~45 identical lines of install instructions onto every tag, which buried the
      # one thing a release page exists to say and forked the README's content into
      # a second copy that would drift.
      #
      # What survives the "does this change per release, or is it needed at the very
      # moment of downloading?" filter is only: the changelog, which file is yours
      # (a dozen-plus artifacts with non-obvious names), and one line each for the
      # unsigned first launch, verification, and auto-update. Architecture coverage
      # is stated outright rather than left to be inferred from the table: a reader
      # who does not find their arch cannot tell "not built" from "missed it", and
      # now that every desktop platform ships both, the line that used to warn about
      # the Windows gap earns its place by telling ARM users not to take the x86-64
      # file out of habit.
      #
      # This runs in release-integrity rather than the build matrix because that job
      # is the only one that runs exactly once — the five desktop jobs would
      # otherwise race each other for the same field.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --json body --jq .body > body.md

          # Re-runs must not stack a second footer onto the first.
          if grep -q '<!-- unissh:footer -->' body.md; then
            echo "footer already present — leaving the notes alone"
            exit 0
          fi

          cat >> body.md <<EOF

          <!-- unissh:footer -->
          ---

          ### Downloads

          | Platform | File |
          | --- | --- |
          | **macOS** (Apple Silicon *and* Intel) | \`UniSSH_${VERSION}_universal.dmg\` |
          | **Windows** (x86-64) | \`UniSSH_${VERSION}_x64-setup.exe\` — or the \`.msi\` |
          | **Windows** (ARM64) | \`UniSSH_${VERSION}_arm64-setup.exe\` — or the \`.msi\` |
          | **Linux** (x86-64) | \`UniSSH_${VERSION}_amd64.AppImage\` · \`.deb\` · \`.rpm\` |
          | **Linux** (ARM64) | \`UniSSH_${VERSION}_aarch64.AppImage\` · \`arm64.deb\` · \`.rpm\` |
          | **Android** (sideload) | \`UniSSH_${VERSION}_universal.apk\` — works on any device |
          | ↳ smaller, if you know your ABI | \`_arm64\` · \`_armv7\` · \`_x86_64\` · \`_x86\` \`.apk\` |
          | **iOS** (sideload, unsigned) | \`UniSSH_${VERSION}_ios-sideload.ipa\` |

          **Every platform above ships both architectures**, Windows included — so if
          your machine is ARM, take the ARM file rather than letting it emulate the
          x86-64 one. Nothing here is 32-bit for desktop.

          **Does this break anything you already have?** The changelog answers that
          per release, including whether the vault format or server protocol moved:
          [CHANGELOG.md](https://github.com/goduni/unissh/blob/main/CHANGELOG.md).

          **Your OS will block the first launch.** These builds carry no Apple or
          Windows code-signing certificate — obtaining one would attach a legal
          identity to an anonymously maintained project. The way past the warning is
          ten seconds per platform:
          [Installing unsigned builds](https://github.com/goduni/unissh#installing-unsigned-builds).

          **Verify it before you trust it.** \`SHA256SUMS\`, a \`minisign\` signature
          over that file, and GitHub build provenance proving this repo's public CI
          built these exact artifacts from this exact commit — which is a stronger
          claim than a certificate:
          [Verifying release integrity](https://github.com/goduni/unissh#verifying-release-integrity).

          **Desktop keeps itself current.** After the first install, UniSSH checks
          this feed, verifies the download against a signing key compiled into the
          app, and installs on your click — never silently. Turn it off in
          Settings → About. Mobile sideloads are updated by hand.
          EOF

          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            --notes-file body.md
