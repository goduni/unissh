name: Publish container images (GHCR)

# Builds and pushes BOTH self-host container images to GHCR so operators can
#   docker compose -f compose.prod.yml up -d
# against prebuilt images instead of cold-compiling Rust + wasm on their box.
#
#   server image  -> ghcr.io/goduni/unissh-server  (server/Dockerfile)
#   caddy/SPA img -> ghcr.io/goduni/unissh-caddy    (deploy/Caddy.Dockerfile)
#
# UNSIGNED BY DESIGN (privacy): like the desktop releases, these images carry NO
# developer code-signing identity — no Apple/Authenticode/Docker Content Trust
# key, nothing tied to a legal person. The trust story is provenance, not a cert:
# each pushed image gets a SLSA build-provenance attestation (the
# actions/attest-build-provenance steps below), bound via GitHub OIDC to this
# public repo + workflow + commit and pushed to the registry. Verify a pulled
# image without trusting the maintainer:
#   gh attestation verify oci://ghcr.io/goduni/unissh-server:main --repo goduni/unissh
#
# IDENTITY-FREE AUTH: the only credential used is the built-in GITHUB_TOKEN
# (logging in as github.actor, the Actions bot) — no personal PAT, no registry
# password, no extra secret of any kind.
#
# BUILD CONTEXT IS THE REPO ROOT (".") FOR BOTH IMAGES — this is load-bearing
# (see compose.yml): server/Dockerfile COPYs rust-core/ + server/, and
# deploy/Caddy.Dockerfile builds crypto-wasm from ../../rust-core/crates/crypto
# plus the Vite SPA. Building from each Dockerfile's own dir would break the
# path deps.

# PATH FILTER = exactly the build context both Dockerfiles COPY, nothing more:
#   server/Dockerfile      -> Cargo.toml, Cargo.lock, rust-core/, server/
#   deploy/Caddy.Dockerfile-> Cargo.toml, rust-core/, server-ui/, deploy/Caddyfile
# Without it a website or client-only commit spent ~20 minutes of QEMU arm64
# emulation before the NEXT commit cancelled it (cancel-in-progress), so at this
# repo's commit rate the images almost never actually got published.
# Tag pushes are unaffected: GitHub does not evaluate `paths` for tags, so `v*`
# always builds and pushes the versioned images.
on:
  push:
    branches: [main] # keep :main / :latest fresh
    tags: ["v*"] # versioned image tags for releases
    paths:
      - "rust-core/**"
      - "server/**"
      - "server-ui/**"
      - "deploy/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # push to GHCR
  id-token: write # OIDC for build provenance
  attestations: write # write the attestation

jobs:
  publish:
    name: build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # server: distroless Rust binary. COPYs rust-core/ + server/.
          - image: unissh-server
            dockerfile: server/Dockerfile
          # caddy/SPA: builds crypto-wasm (path-dep ../../rust-core/crates/crypto)
          # + the Vite SPA, served by caddy:2.
          - image: unissh-caddy
            dockerfile: deploy/Caddy.Dockerfile

    steps:
      - uses: actions/checkout@v7

      # Multi-arch: emulate arm64 on the amd64 runner via QEMU, then drive both
      # platforms through a single buildx builder.
      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Identity-free login: github.actor (the Actions bot) + GITHUB_TOKEN.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags/labels:
      #   * push to main      -> 'main' (branch ref) + 'latest' (default branch)
      #   * push of a v* tag  -> full semver (e.g. 1.2.3) + 'major.minor' (1.2)
      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/goduni/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v7
        with:
          # CRITICAL: context is the repo root for BOTH images (see header /
          # compose.yml) — the Dockerfiles COPY across rust-core/, server/ and
          # server-ui/, which only resolve from a single repo-root context.
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache lives in GHCR, NOT in the Actions cache. `type=gha` is capped
          # at 10 GB per REPOSITORY, shared with every other consumer — and the
          # Swatinem/rust-cache entries from ci.yml and client.yml (Android
          # 1.5 GB, Windows/macOS ~0.9 GB each, times two OS variants) fill that
          # on their own. Once full, exporting a multi-arch Rust image's
          # mode=max cache evicts entries mid-write and the finalize call answers
          # `not_found`, which surfaces as:
          #
          #     #37 exporting to GitHub Actions Cache
          #     #37 ERROR: not_found
          #     ERROR: failed to build: failed to solve: not_found
          #
          # That is why this job failed on every push while unissh-caddy, whose
          # cache is small, kept passing — and why the failure looked mysterious:
          # the image itself had already been pushed successfully one step above,
          # so the red mark was reporting a caching problem as a build problem.
          #
          # A registry-backed cache has no such cap, the credentials are already
          # in hand from the login step, and moving it here hands the whole 10 GB
          # back to the Rust builds that actually benefit from it.
          # `image-manifest=true,oci-mediatypes=true` is what GHCR needs to
          # accept a cache manifest for a multi-platform build.
          cache-from: type=registry,ref=ghcr.io/goduni/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/goduni/${{ matrix.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # SLSA build provenance for the image we just pushed — the compensating
      # control for unsigned-by-design images (consistent with the desktop
      # release-integrity job). Bound via GitHub OIDC, no personal key, and
      # pushed alongside the image in the registry.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/goduni/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
