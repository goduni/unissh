# cargo-deny config for the SHIPPED desktop client (its own workspace, excluded
# from the root). The root deny.toml governs the core crates + server; this file
# governs the Tauri desktop tree, which drags in a GUI toolkit stack the core
# never touches. cargo-deny auto-discovers this file next to Cargo.toml.
#
# CI gates this workspace with `check advisories bans sources` (see .github/workflows/
# ci.yml) — the binary users install, so advisories still matter here.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RSA "Marvin" timing sidechannel — same as the root gate: no patched `rsa`
    # release exists, and it is pulled transitively via ssh-key (SSH RSA host/user
    # keys) which an SSH client cannot drop. Exposure bounded to the SSH device->host
    # path; we recommend Ed25519/ECDSA keys. See root deny.toml for the full note.
    "RUSTSEC-2023-0071",

    # --- Tauri Linux GUI stack: gtk-rs GTK3 bindings, unmaintained upstream ------
    # webkit2gtk-4.1 (the only privacy-preserving Linux webview) binds GTK3, and
    # the gtk3-rs binding crates are no longer maintained. There is NO safe upgrade
    # ("No safe upgrade is available!") until Tauri's Linux backend moves to GTK4 /
    # a maintained webview. Desktop-only, not reachable from the crypto/sync core.
    # Revisit when tauri ships a GTK4 (or non-gtk) Linux webview.
    "RUSTSEC-2024-0411", # atk
    "RUSTSEC-2024-0412", # atk-sys
    "RUSTSEC-2024-0413", # gdk
    "RUSTSEC-2024-0414", # gdk-sys
    "RUSTSEC-2024-0415", # gdkwayland-sys / gdkx11
    "RUSTSEC-2024-0416", # gtk
    "RUSTSEC-2024-0417", # gtk-sys
    "RUSTSEC-2024-0418", # gtk3-macros
    "RUSTSEC-2024-0419", # gdkx11-sys
    "RUSTSEC-2024-0420", # atk / gdk family (remaining gtk3-rs crate)

    # --- Unmaintained transitive build/parse deps (no safe upgrade) --------------
    # proc-macro-error: unmaintained proc-macro helper pulled transitively by the
    # gtk3-macros / older derive crates in the desktop tree. Build-time only.
    "RUSTSEC-2024-0370",
    # unic-* : the `unic` Unicode crates are unmaintained; reached transitively
    # (idna / IDN handling in the desktop stack). No maintained drop-in in range.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident

    # --- zbus split crates, unmaintained since zbus 6 (2026-10-16) ---------------
    # RUSTSEC-2026-0370/0371/0372: zvariant, zbus_names and zvariant_derive were
    # folded into zbus 6 and are no longer released on their own. No patched
    # version exists — the fix is "move to zbus 6". Both zbus lines here still
    # depend on them: zbus 4 via keyring → secret-service (the Linux Secret
    # Service keychain) and zbus 5 via tauri-plugin-opener and our own logind
    # lock watcher. Moving only our code would not drop them. Linux D-Bus only,
    # not reachable from the crypto/sync core. Revisit when keyring and the
    # Tauri plugins move to zbus 6, then move ours with them.
    "RUSTSEC-2026-0370", # zvariant
    "RUSTSEC-2026-0371", # zbus_names
    "RUSTSEC-2026-0372", # zvariant_derive

    # --- basic-toml, unmaintained (RUSTSEC-2026-0374) ----------------------------
    # No successor release. Reached only through askama_derive, the template proc
    # macro of uniffi_bindgen (uniffi's `cli` feature on the core FFI crate), which
    # reads askama's own config at compile time. Never in the app's runtime path,
    # never parsing untrusted input. Same entry as the root deny.toml.
    "RUSTSEC-2026-0374",

    # crypto-bigint (RUSTSEC-2026-0387): some constant-time operations can
    # branch on secret data, depending on compiler and CPU. 0.7.x is patched
    # (0.7.6, in the lockfile). 0.5.5 has no patched release and stays: it
    # comes through elliptic-curve 0.13 (p256/p384/p521 0.13) from ssh-key 0.6,
    # which the embedded agent uses to sign with ECDSA keys, and from
    # jsonwebtoken on the server. Leaving it means the agent's ECDSA signing
    # path is not guaranteed constant-time on every compiler/CPU; Ed25519 and
    # RSA keys do not go through it. The fix is moving ssh-agent to ssh-key 0.7
    # (elliptic-curve 0.14, crypto-bigint 0.7) once it is out of release
    # candidates. Revisit then, or sooner if the advisory is extended to 0.5.
    "RUSTSEC-2026-0387",

    # --- quick-xml DoS advisories (fix is out of the pinned semver range) --------
    # RUSTSEC-2026-0194/0195: quadratic / unbounded-allocation DoS parsing crafted
    # XML. Fix is quick-xml >= 0.41, but the desktop toolkit (muda/wry menu + resource
    # XML) pins ^0.39, so there is no in-range update — bumping needs an upstream
    # Tauri release. Exposure is bounded to toolkit-internal XML (app menus /
    # bundled resources), NOT attacker-controlled network input. Revisit when the
    # Tauri stack moves to quick-xml 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # --- zip extraction advisories (fix is out of the pinned semver range) -------
    # RUSTSEC-2026-0367/0368/0369: `ZipArchive::extract` keeps SUID/SGID bits,
    # follows attacker-chosen symlink targets and applies permissions through
    # symlinks. Patched only in zip >= 9. Reviewed against tauri-plugin-updater
    # 2.13.1 (our lockfile; 2.14.0 on crates.io still declares zip ^4): zip is an
    # optional, Windows-only dependency there, and its one call site
    # (`Install::extract` → `extract_zip`) runs only for a legacy `.zip` updater
    # bundle — with `createUpdaterArtifacts: true` (not `v1Compatible`) ours
    # ship as raw .exe/.msi, so the path is normally never reached. Even then it
    # runs on bytes `Update::download` has already checked against our pinned
    # minisign updater key, and the JS `install` only accepts that resource. The
    # Unix permission/SUID parts have no meaning on Windows. `[bans]` below keeps
    # zip reachable only through the updater, so these ignores cannot silently
    # cover a new consumer. Re-review on any updater bump; drop when it moves
    # to zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

# zip is allowed only as the updater's dependency — see the zip advisories above.
[bans]
multiple-versions = "allow"
deny = [{ crate = "zip", wrappers = ["tauri-plugin-updater"] }]

# Match the root policy: only the public crates.io registry, no unknown git/registry.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
