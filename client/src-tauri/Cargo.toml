[package]
name = "unissh"
version = "0.5.0"
description = "UniSSH — cross-platform SSH client"
authors = ["UniSSH"]
edition = "2021"
rust-version = "1.95"

# This empty table pins src-tauri as its own workspace root, so Cargo does not try
# to attach it to the sibling rust-core workspace reached via the path dependency.
[workspace]

[lib]
name = "unissh_lib"
# staticlib/cdylib -> iOS/Android ; rlib -> desktop binary links the lib
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Open terminal hyperlinks (and About links) in the system default browser.
tauri-plugin-opener = "2"
# Cross-platform logging: stdout + rotating file (per-OS log dir) + webview console.
tauri-plugin-log = "2"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
same-file = "1"
thiserror = "2"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"

# Cloud server integration: blocking HTTP client (rustls TLS, no system OpenSSL)
# and base64 STANDARD (the server's wire encoding for every crypto blob/id).
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "blocking"] }
# x-www-form-urlencoded body for the OIDC token exchange (reqwest's `.form()` is
# stripped by default-features=false; this is the same crate it uses internally).
serde_urlencoded = "0.7"
base64 = "0.23.0"
# Content-stable Idempotency-Key for sync/push (server replays identical pushes).
sha2 = "0.10"

# The SSH core — depended on directly as a path dependency (its crate-type includes `lib`).
unissh-ffi = { path = "../../rust-core/crates/ffi" }
# The key hierarchy, named directly for one thing the FFI facade has no reason
# to export: `device_wrap`, which seals the biometric-unlock material under a
# device secret (src/biometric.rs). Checking the password before it is stored
# goes through the facade (`Core::verify_unlock_password`). Already compiled as
# part of unissh-ffi; naming it adds nothing to the build.
unissh-keychain = { path = "../../rust-core/crates/keychain" }
# Zeroizing buffers for the biometric-unlock material and device secret. Already
# in the tree through the core.
zeroize = "1"

# Mobile-only biometric unlock (no desktop support / no-op on desktop).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-biometric = "2"

# Android is the only platform where the certificate trust store is reached over
# JNI rather than read off disk, so `rustls-platform-verifier` — which reqwest's
# `rustls` feature pulls in and verifies every TLS connection with — has to be
# handed the JVM and the app Context before it runs, or it panics (#34). See
# src/platform_tls.rs.
#
# The version MUST stay semver-compatible with the one reqwest resolves: the
# crate keeps the JNI handles in a private process-global OnceCell, and two
# incompatible copies would each get their own — we would initialise one while
# reqwest verified against the other, which fails exactly like no init at all.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"
# DELETE WITH src/platform_tls/android.rs — this line exists only for that file
# and has no other caller. Named directly so it can wrap the verifier above: the
# same Android facility reports "certificate revoked" when it merely had no OCSP
# responder to ask, which is now the norm for Let's Encrypt and Google Trust
# Services and broke every cloud request on Android. Wrapping a
# `ServerCertVerifier` means naming rustls types, and reqwest does not re-export
# the crate.
#
# The SAME semver caveat as above, and it bites HARDER here, because it is a
# RUNTIME trap rather than a compile-time one: `tls_backend_preconfigured` takes
# `impl Any` and downcasts at run time, so a second copy of the crate type-checks
# perfectly and fails inside `Client::build()` with "Unknown TLS backend passed to
# `use_preconfigured_tls`". src/cloud/client.rs logs that, then falls back to a
# default client — safe, but back to the Android bug this fixes.
#
# `default-features = false` is load-bearing, not tidiness: rustls's defaults add
# `logging` and `prefer-post-quantum`, and the latter changes the ClientHello key
# share on every connection — a behaviour change nothing here asked for. The three
# features named are exactly the ones reqwest asks for itself (`std` + `tls12` on
# the dependency, `aws-lc-rs` via its `__rustls-aws-lc-rs`), so this activates
# nothing new and features unify on the single resolved crate. `aws-lc-rs` is
# named rather than inherited on purpose: android.rs writes
# `rustls::crypto::aws_lc_rs` by hand, and that module only exists behind this
# feature — leaving it to reqwest would mean a change in reqwest's own feature
# wiring silently breaks a file no PR-time CI job compiles.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }

# In-place auto-update, desktop only. There is no mobile updater: Android/iOS
# ship as sideload artifacts and are re-installed by hand. Update payloads are
# verified against the minisign public key in tauri.conf.json before anything is
# executed — that key, not a code-signing certificate, is what makes an unsigned
# distributable safely updatable (see .github/workflows/client.yml).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
unissh-mcp = { path = "../../rust-core/crates/mcp" }
unissh-automation = { path = "../../rust-core/crates/automation", features = ["core"] }
tokio = { version = "1", features = ["sync", "time", "net", "macros"] }
tauri-plugin-updater = "2"
# Mounted volumes for the SFTP local pane's drive picker (Windows drive letters
# with their labels, /Volumes on macOS, mount points on Linux). Desktop-only:
# neither mobile OS lets the app browse outside its sandbox, so there is nothing
# to switch between there. `disk` is the only feature we need — the default set
# also pulls process/CPU/network collection we would never call.
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
# Only used to relaunch into the freshly installed version once the updater has
# swapped the bundle on disk. Pulled in beside the updater rather than globally:
# nothing else in the app restarts the process.
tauri-plugin-process = "2"

# OS keychain for the Secret Key (per-platform native backend; no extra C deps).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Lock the vault when the screen locks or the machine sleeps: loginwindow's
# `com.apple.screenIsLocked` on the DISTRIBUTED notification centre, and
# NSWorkspace's will-sleep notification (see src/system_lock/macos.rs). Both
# crates are already in the tree under wry; naming them here pulls in nothing
# new, it only makes the two classes we need reachable.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSString",
] }
# Raw objc2 message-send to opt the content view back into compact control-size
# metrics on macOS 26 Tahoe (see run()): built against SDK 26 the traffic lights
# otherwise render at the enlarged Liquid Glass size. Same major as iOS below.
objc2 = "0.6"
# Unlock with Touch ID (see src/biometric/macos.rs): a data-protection Keychain
# item whose access control requires the CURRENT biometric set, written and read
# with the raw SecItem* calls because the safe `passwords` API in
# security-framework cannot attach an authentication context (the prompt's
# reason string) to a query. Both crates are the copies keyring's apple-native
# backend already resolves (security-framework 3.7 / core-foundation 0.10), so
# nothing new is built; `OSX_10_15` on the -sys crate only makes
# `kSecUseDataProtectionKeychain` visible.
security-framework = "3"
security-framework-sys = { version = "2.17", features = ["OSX_10_15"] }
core-foundation = "0.10"
# `LAContext`: whether Touch ID is available and enrolled, the prompt itself
# (`evaluatePolicy`, hence `block2` for its reply), and the biometric domain
# state that detects a re-enrolment (`LADomainState` on macOS 15+). The one
# genuinely new crate for this feature, from the same objc2 0.3 generation as the
# AppKit/Foundation bindings above; block2 0.6 is already in the tree under wry.
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "LAContext",
    "LADomainState",
] }
block2 = "0.6"
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Unlock with Windows Hello (see src/biometric/windows.rs): `KeyCredentialManager`
# creates a Hello-protected key and signs a challenge with it, and the signature
# is the secret the stored password is sealed under. That is WinRT
# (`Windows.Security.Credentials`), which `windows-sys` does not cover, hence the
# `windows` crate — the 0.62 copy Tauri, wry and webview2-com already resolve, so
# no second `windows-*` tree is built. `Security_Cryptography` is for
# `CryptographicBuffer` (bytes <-> `IBuffer`, and the random challenge),
# `Storage_Streams` for `IBuffer` itself and the methods that take or return one.
# `Security_Credentials_UI` is `UserConsentVerifier`, used only for the
# Secret-Key-only startup presence gate, which guards no stored secret.
windows = { version = "0.62", features = [
    "Security_Credentials",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Storage_Streams",
] }
# Lock the vault when the session locks or the machine suspends: a hidden
# top-level window that receives WM_WTSSESSION_CHANGE and WM_POWERBROADCAST
# (see src/system_lock/windows.rs). `windows-sys`, not `windows`: these are half
# a dozen raw Win32 calls with no COM anywhere near them, and it is the crate
# already in the tree via the toolchain's own dependencies. `Win32_Graphics_Gdi`
# is not drawing anything — `WNDCLASSW` carries an `HBRUSH` field, so the struct
# itself lives behind that feature.
# The system agent's named pipe (src/system_agent/pipe.rs) adds the current
# user's SID from the process token (`Win32_Security`, `Win32_System_Threading`),
# the SDDL → security descriptor conversion for its DACL
# (`Win32_Security_Authorization`), and the caller's pid and executable
# (`Win32_System_Pipes`, `Win32_System_Threading`).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
[target.'cfg(target_os = "linux")'.dependencies]
# The Secret Service (GNOME Keyring / KWallet / any freedesktop provider) — the
# actual analogue of the macOS Keychain, and the only Linux store that survives a
# reboot. NOT `linux-native`, which this used to be: that is the kernel keyutils
# facility, which the crate's own docs describe as a cache ("completely in-memory
# and will not persist across reboots"). It also holds nothing a user can see or
# revoke in Seahorse or KWalletManager. A "remember the Secret Key on this device"
# that quietly forgets on the next boot is worse than one that says it cannot.
#
# `async-io`, not `tokio`, is deliberate: keyring's own docs warn that the async
# secret-service on a tokio runtime deadlocks when called from the main thread,
# and this app has a tokio runtime. async-io keeps zbus on its own executor. Both
# it and `crypto-rust` also keep this pure Rust — no libdbus and no OpenSSL to
# find at build time or ship in the AppImage, which is the trap the bundled
# libwayland already taught us once.
#
# `linux-native` stays enabled alongside, and NOT as the store: with both on, the
# secret service is the default and keyutils is reachable only where we name it —
# which is exactly one place, the one-time carry-over of a key an older build left
# in keyutils (see `carry_over_from_keyutils`).
keyring = { version = "3", features = [
    "async-secret-service",
    "async-io",
    "crypto-rust",
    "linux-native",
] }
# Lock the vault when the session locks or the machine suspends: logind's
# `PrepareForSleep` and session `Lock`/`Unlock` on the system bus, with the
# GNOME/KDE screensaver `ActiveChanged` on the session bus as the fallback for
# desktops that never tell logind (see src/system_lock/linux.rs).
#
# Not a new dependency in practice: `keyring` above already resolves this exact
# zbus through its async-secret-service backend. The features here say so
# explicitly — `async-io` because zbus demands exactly one runtime and picking
# `tokio` would change the one keyring carefully chose (see the note above),
# `blocking-api` because each listener is a thread parked on a message stream
# and has no reason to be async.
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
# iOS reuses the same `keyring` code as desktop (Apple Security framework backend).
[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Raw objc2 message-send to set the WKWebView scroll view's
# contentInsetAdjustmentBehavior = .never (see run() / with_webview): without it
# iOS confines web content to the safe area and a dead band shows below the tab
# bar. objc2 is already in the tree transitively via tauri/wry; pin the same major.
objc2 = "0.6"

[features]
# this feature is used for production builds where `devUrl` is unset; see tauri.conf.json
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# Live cloud integration tests (ignored by default): temp instance dirs + server DB.
tempfile = "3"

# Copy of the root workspace's lint policy (separate Cargo root — cannot inherit).
# Three documented differences: `unsafe_code = "allow"` (JNI, Security.framework,
# LocalAuthentication bindings live here; every block still needs a `// SAFETY:`
# comment), `missing_docs = "allow"` (binary crate) and `clippy::unreachable = "allow"`
# (it fires inside the `#[tauri::command]` expansion). Keep the rest identical to
# ../../Cargo.toml.
[lints.rust]
# Safety
unsafe_code = "allow"                     # JNI, Security.framework, LocalAuthentication bindings; every block still needs `// SAFETY:`
# Hidden behaviour
ambiguous_negative_literals = "warn"      # `-1.abs()` is `-(1.abs())`
deref_into_dyn_supertrait = "warn"
let_underscore_drop = "warn"              # `let _ = guard;` drops the guard right away
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
unstable_features = "warn"
# Public API
missing_docs = "allow"                    # binary crate
unnameable_types = "warn"
# Dead code
explicit_outlives_requirements = "warn"
macro_use_extern_crate = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[lints.clippy]
# No panics in shipped code (tests may: see clippy.toml allow-*-in-tests)
unwrap_used = "deny"
expect_used = "deny"                      # a true invariant keeps `.expect()` under `#[expect(clippy::expect_used, reason)]`
panic = "deny"
unreachable = "allow"                     # fires inside #[tauri::command] expansion (209 sites); our own code has no unreachable!()
todo = "deny"
unimplemented = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
indexing_slicing = "deny"                 # `get()` on hostile input; frozen codecs change only the access, never the bytes
string_slice = "deny"                     # panics off a char boundary
unchecked_time_subtraction = "deny"
cast_abs_to_unsigned = "deny"
missing_assert_message = "warn"
exit = "warn"
# Numbers and casts (as_conversions is too blunt; these are the dangerous casts)
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
fn_to_numeric_cast_any = "warn"
host_endian_bytes = "warn"                # wire and blob formats are big-endian
little_endian_bytes = "warn"              # storage automation_fingerprint (LE since v1) and the server sink jitter expect it on site
# Documented unsafe
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
mem_forget = "warn"
# No debug output (second layer under scripts/check-log-redaction.py)
dbg_macro = "deny"
print_stdout = "warn"                     # cli expects it crate-wide; server setup-code output expects it on site
print_stderr = "warn"
use_debug = "warn"                        # catches {:?} in print/write macros; log/tracing calls rely on scripts/check-log-redaction.py and review
pointer_format = "warn"
# Handled errors
map_err_ignore = "warn"                   # crypto/vault/keychain expect it: error-cause erasure there is deliberate (no oracle)
try_err = "warn"
unused_result_ok = "warn"
# Suppressions are explicit and explained
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Control flow
wildcard_enum_match_arm = "warn"          # a new variant must break the match, not fall into `_`
infinite_loop = "warn"
mixed_read_write_in_expression = "warn"
rest_pat_in_fully_bound_structs = "warn"
unneeded_field_pattern = "warn"
# Modules
mod_module_files = "deny"                 # `foo.rs` over `foo/mod.rs`
# Idiomatic std
iter_over_hash_type = "warn"              # hash order is per-process; canonical encodings must never depend on it
create_dir = "warn"
filetype_is_file = "warn"
verbose_file_reads = "warn"
pathbuf_init_then_push = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
str_to_string = "warn"
string_add = "warn"
if_then_some_else_none = "warn"
needless_raw_strings = "warn"
string_lit_chars_any = "warn"
map_with_unused_argument_over_ranges = "warn"
return_and_then = "warn"
deref_by_slicing = "warn"
# Consistent style
redundant_type_annotations = "warn"
unseparated_literal_suffix = "warn"
semicolon_inside_block = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
large_include_file = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
# Complexity (thresholds in clippy.toml; ratchet them down release by release)
too_many_lines = "warn"
cognitive_complexity = "warn"
excessive_nesting = "warn"
# Pedantic, picked by name (the group as a whole is documentation churn)
needless_pass_by_value = "allow"            # deferred: 242 sites, 234 of them uniffi-exported fns whose by-value String params are the binding contract; follow-up
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
match_wildcard_for_single_variants = "warn"
unnested_or_patterns = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
manual_string_new = "warn"
needless_continue = "warn"
range_plus_one = "warn"
ref_option = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
items_after_statements = "warn"
inconsistent_struct_constructor = "warn"
trivially_copy_pass_by_ref = "warn"
default_trait_access = "warn"
# Nursery, picked by name (toolchain is pinned, so the set is stable)
significant_drop_tightening = "warn"      # Tauri holds mutexes longer than it needs to
redundant_clone = "warn"
needless_collect = "warn"
use_self = "warn"
iter_on_single_items = "warn"
iter_on_empty_collections = "warn"
equatable_if_let = "warn"
or_fun_call = "warn"
string_lit_as_bytes = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
collection_is_never_read = "warn"
useless_let_if_seq = "warn"
derive_partial_eq_without_eq = "warn"
missing_const_for_fn = "warn"
