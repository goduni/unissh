[package]
name = "unissh"
version = "0.4.0"
description = "UniSSH — cross-platform SSH client"
authors = ["UniSSH"]
edition = "2021"
rust-version = "1.85"

# This empty table pins src-tauri as its own workspace root, so Cargo does not try
# to attach it to the sibling rust-core workspace reached via the path dependency.
[workspace]

[lib]
name = "unissh_lib"
# staticlib/cdylib -> iOS/Android ; rlib -> desktop binary links the lib
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Open terminal hyperlinks (and About links) in the system default browser.
tauri-plugin-opener = "2"
# Cross-platform logging: stdout + rotating file (per-OS log dir) + webview console.
tauri-plugin-log = "2"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dashmap = "6"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"

# Cloud server integration: blocking HTTP client (rustls TLS, no system OpenSSL)
# and base64 STANDARD (the server's wire encoding for every crypto blob/id).
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "blocking"] }
# x-www-form-urlencoded body for the OIDC token exchange (reqwest's `.form()` is
# stripped by default-features=false; this is the same crate it uses internally).
serde_urlencoded = "0.7"
base64 = "0.23.0"
# Content-stable Idempotency-Key for sync/push (server replays identical pushes).
sha2 = "0.10"

# The SSH core — depended on directly as a path dependency (its crate-type includes `lib`).
unissh-ffi = { path = "../../rust-core/crates/ffi" }

# Mobile-only biometric unlock (no desktop support / no-op on desktop).
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-biometric = "2"

# Android is the only platform where the certificate trust store is reached over
# JNI rather than read off disk, so `rustls-platform-verifier` — which reqwest's
# `rustls` feature pulls in and verifies every TLS connection with — has to be
# handed the JVM and the app Context before it runs, or it panics (#34). See
# src/platform_tls.rs.
#
# The version MUST stay semver-compatible with the one reqwest resolves: the
# crate keeps the JNI handles in a private process-global OnceCell, and two
# incompatible copies would each get their own — we would initialise one while
# reqwest verified against the other, which fails exactly like no init at all.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier = "0.7"
# DELETE WITH src/platform_tls/android.rs — this line exists only for that file
# and has no other caller. Named directly so it can wrap the verifier above: the
# same Android facility reports "certificate revoked" when it merely had no OCSP
# responder to ask, which is now the norm for Let's Encrypt and Google Trust
# Services and broke every cloud request on Android. Wrapping a
# `ServerCertVerifier` means naming rustls types, and reqwest does not re-export
# the crate.
#
# The SAME semver caveat as above, and it bites HARDER here, because it is a
# RUNTIME trap rather than a compile-time one: `tls_backend_preconfigured` takes
# `impl Any` and downcasts at run time, so a second copy of the crate type-checks
# perfectly and fails inside `Client::build()` with "Unknown TLS backend passed to
# `use_preconfigured_tls`". src/cloud/client.rs logs that, then falls back to a
# default client — safe, but back to the Android bug this fixes.
#
# `default-features = false` is load-bearing, not tidiness: rustls's defaults add
# `logging` and `prefer-post-quantum`, and the latter changes the ClientHello key
# share on every connection — a behaviour change nothing here asked for. The three
# features named are exactly the ones reqwest asks for itself (`std` + `tls12` on
# the dependency, `aws-lc-rs` via its `__rustls-aws-lc-rs`), so this activates
# nothing new and features unify on the single resolved crate. `aws-lc-rs` is
# named rather than inherited on purpose: android.rs writes
# `rustls::crypto::aws_lc_rs` by hand, and that module only exists behind this
# feature — leaving it to reqwest would mean a change in reqwest's own feature
# wiring silently breaks a file no PR-time CI job compiles.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }

# In-place auto-update, desktop only. There is no mobile updater: Android/iOS
# ship as sideload artifacts and are re-installed by hand. Update payloads are
# verified against the minisign public key in tauri.conf.json before anything is
# executed — that key, not a code-signing certificate, is what makes an unsigned
# distributable safely updatable (see .github/workflows/client.yml).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-updater = "2"
# Mounted volumes for the SFTP local pane's drive picker (Windows drive letters
# with their labels, /Volumes on macOS, mount points on Linux). Desktop-only:
# neither mobile OS lets the app browse outside its sandbox, so there is nothing
# to switch between there. `disk` is the only feature we need — the default set
# also pulls process/CPU/network collection we would never call.
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
# Only used to relaunch into the freshly installed version once the updater has
# swapped the bundle on disk. Pulled in beside the updater rather than globally:
# nothing else in the app restarts the process.
tauri-plugin-process = "2"

# OS keychain for the Secret Key (per-platform native backend; no extra C deps).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Lock the vault when the screen locks or the machine sleeps: loginwindow's
# `com.apple.screenIsLocked` on the DISTRIBUTED notification centre, and
# NSWorkspace's will-sleep notification (see src/system_lock/macos.rs). Both
# crates are already in the tree under wry; naming them here pulls in nothing
# new, it only makes the two classes we need reachable.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSString",
] }
# Raw objc2 message-send to opt the content view back into compact control-size
# metrics on macOS 26 Tahoe (see run()): built against SDK 26 the traffic lights
# otherwise render at the enlarged Liquid Glass size. Same major as iOS below.
objc2 = "0.6"
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Lock the vault when the session locks or the machine suspends: a hidden
# top-level window that receives WM_WTSSESSION_CHANGE and WM_POWERBROADCAST
# (see src/system_lock/windows.rs). `windows-sys`, not `windows`: these are half
# a dozen raw Win32 calls with no COM anywhere near them, and it is the crate
# already in the tree via the toolchain's own dependencies. `Win32_Graphics_Gdi`
# is not drawing anything — `WNDCLASSW` carries an `HBRUSH` field, so the struct
# itself lives behind that feature.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }
[target.'cfg(target_os = "linux")'.dependencies]
# The Secret Service (GNOME Keyring / KWallet / any freedesktop provider) — the
# actual analogue of the macOS Keychain, and the only Linux store that survives a
# reboot. NOT `linux-native`, which this used to be: that is the kernel keyutils
# facility, which the crate's own docs describe as a cache ("completely in-memory
# and will not persist across reboots"). It also holds nothing a user can see or
# revoke in Seahorse or KWalletManager. A "remember the Secret Key on this device"
# that quietly forgets on the next boot is worse than one that says it cannot.
#
# `async-io`, not `tokio`, is deliberate: keyring's own docs warn that the async
# secret-service on a tokio runtime deadlocks when called from the main thread,
# and this app has a tokio runtime. async-io keeps zbus on its own executor. Both
# it and `crypto-rust` also keep this pure Rust — no libdbus and no OpenSSL to
# find at build time or ship in the AppImage, which is the trap the bundled
# libwayland already taught us once.
#
# `linux-native` stays enabled alongside, and NOT as the store: with both on, the
# secret service is the default and keyutils is reachable only where we name it —
# which is exactly one place, the one-time carry-over of a key an older build left
# in keyutils (see `carry_over_from_keyutils`).
keyring = { version = "3", features = [
    "async-secret-service",
    "async-io",
    "crypto-rust",
    "linux-native",
] }
# Lock the vault when the session locks or the machine suspends: logind's
# `PrepareForSleep` and session `Lock`/`Unlock` on the system bus, with the
# GNOME/KDE screensaver `ActiveChanged` on the session bus as the fallback for
# desktops that never tell logind (see src/system_lock/linux.rs).
#
# Not a new dependency in practice: `keyring` above already resolves this exact
# zbus through its async-secret-service backend. The features here say so
# explicitly — `async-io` because zbus demands exactly one runtime and picking
# `tokio` would change the one keyring carefully chose (see the note above),
# `blocking-api` because each listener is a thread parked on a message stream
# and has no reason to be async.
zbus = { version = "5", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
# iOS reuses the same `keyring` code as desktop (Apple Security framework backend).
[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Raw objc2 message-send to set the WKWebView scroll view's
# contentInsetAdjustmentBehavior = .never (see run() / with_webview): without it
# iOS confines web content to the safe area and a dead band shows below the tab
# bar. objc2 is already in the tree transitively via tauri/wry; pin the same major.
objc2 = "0.6"

[features]
# this feature is used for production builds where `devUrl` is unset; see tauri.conf.json
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# Live cloud integration tests (ignored by default): temp instance dirs + server DB.
tempfile = "3"
