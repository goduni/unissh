[package]
name = "unissh-cli"
version.workspace = true
description = "UniSSH in a terminal: sign a machine in as a device, pull the vaults, and connect to their hosts without a GUI."
readme = "README.md"
edition.workspace = true
# `File::lock` (the sync lock between two CLI processes) is 1.89.
rust-version = "1.89"
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "unissh"
path = "src/main.rs"

# The original core harness: secrets as arguments, local vaults only. Kept for
# the local quickstart and for poking at the facade; not for real use.
[[bin]]
name = "unissh-harness"
path = "src/bin/unissh-harness.rs"

[dependencies]
unissh-ffi = { path = "../ffi" }
unissh-cloud = { path = "../cloud" }
# `unissh mcp`: the desktop's MCP transport and broker, over this device's core.
unissh-mcp = { path = "../mcp" }
unissh-automation = { path = "../automation", features = ["core"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# All already in the tree: the MCP server's runtime and its stderr log.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
log = "0.4"

# Raw terminal mode, window size, polling the terminal and the user id — through
# safe wrappers, since the workspace denies `unsafe`. Already in the tree (tempfile).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios", "event", "process"] }

# `unissh mcp` pauses on a session lock or sleep, as the desktop does: logind on
# the system bus (src/system_lock.rs). The desktop's D-Bus crate (zbus 5, pure
# Rust, no libdbus), here on the Tokio runtime the server already runs; its
# `async-io` and blocking API are the desktop's choices for keyring, not needed.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
