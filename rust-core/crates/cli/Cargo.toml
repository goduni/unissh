[package]
name = "unissh-cli"
version.workspace = true
description = "UniSSH in a terminal: sign a machine in as a device, pull the vaults, and connect to their hosts without a GUI."
readme = "README.md"
edition.workspace = true
# `File::lock` (the sync lock between two CLI processes) is 1.89.
rust-version = "1.89"
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "unissh"
path = "src/main.rs"

# The original core harness: secrets as arguments, local vaults only. Kept for
# the local quickstart and for poking at the facade; not for real use.
[[bin]]
name = "unissh-harness"
path = "src/bin/unissh-harness.rs"

[dependencies]
unissh-ffi = { path = "../ffi" }
unissh-cloud = { path = "../cloud" }
# `unissh mcp`: the desktop's MCP transport and broker, over this device's core.
unissh-mcp = { path = "../mcp" }
unissh-automation = { path = "../automation", features = ["core"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# `export --force`: an owner-only file beside the target, renamed over it.
tempfile = "3"
# Catching Ctrl-C, SIGTERM and SIGHUP through a safe API (`signals.rs`), on
# every platform (Windows has Ctrl-C), and the runtime the commands that need
# one run on (`unissh mcp` serves on it too). One entry for all of them.
# Already in the tree (the core's runtime); no new crate.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "time"] }
# `unissh mcp`'s stderr log. Already in the tree.
log = "0.4"

# Raw terminal mode, window size, polling the terminal and the user id — through
# safe wrappers, since the workspace denies `unsafe`. Already in the tree (tempfile).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios", "event", "process"] }

# `unissh mcp` pauses on a session lock or sleep, as the desktop does: logind on
# the system bus (src/system_lock.rs). zbus 6, pure Rust, no libdbus, on the
# Tokio runtime the server already runs, so `default-rt` is not needed. The
# desktop stays on zbus 5 until keyring and tauri-plugin-opener move to 6.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

# Native console input, mode restoration, UTF-8 and private-file ACLs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[features]
# Release binaries carry libcrypto, including both slices of the macOS binary.
portable = ["unissh-ffi/vendored-openssl"]

[dev-dependencies]
# Exercise real PTYs, including native Windows ConPTY, rather than terminal stubs.
portable-pty = "0.9"

[lints]
workspace = true
