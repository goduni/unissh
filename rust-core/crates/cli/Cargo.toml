[package]
name = "unissh-cli"
version.workspace = true
description = "UniSSH in a terminal: sign a machine in as a device, pull the vaults, and connect to their hosts without a GUI."
readme = "README.md"
edition.workspace = true
# `File::lock` (the sync lock between two CLI processes) is 1.89.
rust-version = "1.89"
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "unissh"
path = "src/main.rs"

# The original core harness: secrets as arguments, local vaults only. Kept for
# the local quickstart and for poking at the facade; not for real use.
[[bin]]
name = "unissh-harness"
path = "src/bin/unissh-harness.rs"

[dependencies]
unissh-ffi = { path = "../ffi" }
unissh-cloud = { path = "../cloud" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
# `export --force`: an owner-only file beside the target, renamed over it.
tempfile = "3"
# Catching Ctrl-C, SIGTERM and SIGHUP through a safe API (`signals.rs`), on
# every platform (Windows has Ctrl-C), and the runtime the commands that need
# one run on. One entry for all of them. Already in the tree (the core's
# runtime); no new crate.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "time"] }

# Raw terminal mode, window size, polling the terminal and the user id — through
# safe wrappers, since the workspace denies `unsafe`. Already in the tree (tempfile).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["termios", "event", "process"] }

[lints]
workspace = true
