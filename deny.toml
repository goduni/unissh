# cargo-deny — supply-chain gate for a crypto/SSH core.
# Docs: https://embarkstudios.github.io/cargo-deny/
# Re-homed from rust-core/deny.toml to the workspace root (its original scope).

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RSA "Marvin" timing sidechannel. No patched `rsa` release exists; it is
    # pulled in transitively to support SSH RSA keys (host + user), which an SSH
    # client cannot drop. NOTE: `rsa` is reached via TWO paths — `ssh-key` 0.6 in
    # `unissh-ssh-agent` AND a pre-release `ssh-key` inside `russh` — so removing
    # russh alone does NOT clear this advisory. The exposure is bounded to the SSH
    # device->host path (the vault/sync crypto core is rsa-free); we recommend
    # Ed25519/ECDSA user keys. Revisit when upstream ships a constant-time `rsa`.
    # russh 0.61 also transitively pulls pre-release (rc) RustCrypto crates for the
    # SSH session crypto — track upstream for a release on stabilized deps.
    "RUSTSEC-2023-0071",

    # basic-toml is unmaintained (RUSTSEC-2026-0374) and has no successor
    # release. It is only reached through askama_derive, the template proc macro
    # of uniffi_bindgen (pulled in by uniffi's `cli` feature for the
    # uniffi-bindgen binary). The proc macro uses it to read askama's own config at
    # compile time; it is never in a shipped binary's runtime path and never
    # parses untrusted input. Revisit when askama drops it or uniffi moves on.
    "RUSTSEC-2026-0374",

    # crypto-bigint (RUSTSEC-2026-0387): some constant-time operations can
    # branch on secret data, depending on compiler and CPU. 0.7.x is patched
    # (0.7.6, in the lockfile). 0.5.5 has no patched release and stays: it
    # comes through elliptic-curve 0.13 (p256/p384/p521 0.13) from ssh-key 0.6,
    # which the embedded agent uses to sign with ECDSA keys, and from
    # jsonwebtoken on the server. Leaving it means the agent's ECDSA signing
    # path is not guaranteed constant-time on every compiler/CPU; Ed25519 and
    # RSA keys do not go through it. The fix is moving ssh-agent to ssh-key 0.7
    # (elliptic-curve 0.14, crypto-bigint 0.7) once it is out of release
    # candidates. Revisit then, or sooner if the advisory is extended to 0.5.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # webpki-roots ships its trust-store data under CDLA-Permissive-2.0
    # (pulled in transitively via sqlx -> unissh-server).
    "CDLA-Permissive-2.0",
]

[bans]
# "warn" (not "deny"): the SSH stack (russh rc-tree), sqlx, and uniffi/figment
# (toml/winnow) inherently pull duplicate minor versions of low-level crates, and
# denying would block routine updates. The skip-tree below silences the known,
# accepted duplicate roots so a genuinely NEW duplicate still shows up as signal
# rather than being lost among the pre-accepted ones.
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
skip-tree = [
    # winnow 0.7.x (askama/toml_edit) vs 1.x (toml_parser) via uniffi/figment.
    { name = "winnow" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
